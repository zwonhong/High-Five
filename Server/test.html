<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>소켓 입장 테스트</title>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .status-box { padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .connected { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .disconnected { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .info { font-size: 1.2em; font-weight: bold; }
        #log { background: #f5f5f5; padding: 10px; border: 1px solid #ddd; height: 200px; overflow-y: auto; font-family: monospace; }
    </style>
</head>
<body>
    <h1>High-Five 서버 테스트</h1>
    
    <!-- 1. 입장 전: 닉네임 입력 구역 before joining: nickname input area -->
    <div id="loginArea">
        <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요">
        <button onclick="joinGame()">입장하기</button>
    </div>

    <!-- 2. 입장 후: 채팅 및 정보 구역 (처음엔 숨김) chat/info field (first hided) -->
    <div id="gameArea" style="display: none;">
        <div id="statusBox" class="status-box disconnected">
            상태: <span id="statusText">연결 시도 중...</span> | 
            방 ID: <span id="roomIdText">-</span>
        </div>

        <p class="info">현재 방 인원: <span id="userCount">0</span> / 5</p>

        <!-- 3. 캔버스 영역 Canvas Area--> 
        <h3>Canvas</h3>
        <div style="margin-bottom: 10px;">
            <!-- 실제 그림이 그려질 도화지 -->
            <canvas id="drawingCanvas" width="500" height="400" style="border: 1px solid #000; background: #fff; cursor: crosshair; display: block;"></canvas>
            
            <!-- 캔버스 조작 버튼 -->
            <div style="margin-top: 5px;">
                <button onclick="clearCanvas()">전체 지우기</button>
            </div>
        </div>

        <h3>Chat - log</h3>
        <div id="log"></div>

        <!-- 메시지 입력 구역 msg input field--> 
        <div style="margin-top: 10px;">
            <input type="text" id="msgInput" placeholder="메시지를 입력하세요" style="width: 80%; padding: 5px;" onkeypress="if(event.keyCode==13) sendChat()">
            <button onclick="sendChat()" style="padding: 5px 15px;">전송</button>
        </div>
    </div>

    // 나중에 UI가 마련되면 아래 스크립트만 옮겨서 사용하고, 위의 테스트용 UI는 제거하셔도 됩니다. 
    // Once the UI is ready, you can move the script below and remove the above test UI.
    <script>
        const logDiv = document.getElementById('log');
        const userCountSpan = document.getElementById('userCount');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const roomIdText = document.getElementById('roomIdText');

        // 소켓 초기화 (자동 연결 방지) Initialize socket (auto X)
        const socket = io("/", { 
            autoConnect: false,
            transports: ['websocket', 'polling'] // websocket 우선, 폴링은 fallback 용 (websocket first, polling fallback)
        });

        // 로그 출력 함수 (sysmsg / chat 구분)) Log output (sysmsg / chat distinction)
        function addLog(message, isChat = false) {
            const time = new Date().toLocaleTimeString();
            // 채팅일 경우 닉네임 부분을 Bold 처리
            const logContent = isChat ? message : `[시스템] ${message}`;
            logDiv.innerHTML += `<div><small>${time}</small> ${logContent}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        // 입장 함수 (버튼 클릭 시 호출) Join function (called when button pressed)
        function joinGame() {
            const nickname = document.getElementById('nicknameInput').value;
            if (!nickname) return alert("닉네임을 입력해주세요!");

            // 버튼과 입력창 잠금 Disable input and button to prevent multiple attempts
            const nicknameInput = document.getElementById('nicknameInput');
            const joinButton = document.querySelector("#loginArea button");
            nicknameInput.disabled = true;
            if(joinButton) joinButton.disabled = true;
            
            addLog("Trying to connect ...");

            // 기존 연결이 있다면 끊고 새로 연결 New connection after disconnecting existing one if any
            if (socket.connected) socket.disconnect();
    
            socket.connect(); // 서버 연결 시작 Start connection to server
            
            // 연결 성공 시 join_auto 실행되도록 일회성 등록 If connection is successful, emit join_auto once
            socket.once("connect", () => {
                // 연결되자마자 화면 넘기지 않고 서버에 입장 요청 Emit join_auto to server immediately upon connection, without switching screen yet
                socket.emit('join_auto', nickname);
                addLog(`Connected (Nickname: ${nickname})`);
            });

            // 연결 실패(서버 다운 등) 시 즉시 알림
            socket.once("connect_error", (err) => {
                alert("Connection failed: " + err.message);
                document.getElementById('nicknameInput').disabled = false;
                addLog("Connection failed: " + err.message);
            });
        }

        // UI를 다시 로그인 상태로 되돌리는 공통 함수
        function resetLoginUI() {
            document.getElementById('loginArea').style.display = 'block';
            document.getElementById('gameArea').style.display = 'none';
            const nicknameInput = document.getElementById('nicknameInput');
            const joinButton = document.querySelector("#loginArea button");
            
            nicknameInput.disabled = false;
            if(joinButton) joinButton.disabled = false;
            nicknameInput.focus();
        }

        // 채팅 전송 함수 Send chat messages
        function sendChat() {
            const input = document.getElementById('msgInput');
            if (!input.value.trim()) return;

            socket.emit('send_chat', input.value); // 서버로 전송 Send to server
            input.value = ''; // 입력창 초기화 clean input field
        }

        // 채팅 수신 Receive chat messages
        socket.on("receive_chat", (data) => {
            addLog(`<strong>${data.sender}:</strong> ${data.message}`, true);
        });

        // 캔버스 관련 변수 및 설정 Canvas related variables and settings
        let isGameStarted = false;
        
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        
        // 초기 상태: 캔버스 비활성화 Initial state: canvas disabled
        canvas.style.opacity = "0.5";         // 반투명하게 make it semi-transparent
        canvas.style.pointerEvents = "none";  // 마우스 클릭/이벤트 무시 ignore mouse events
        canvas.style.backgroundColor = "#f0f0f0"; // 비활성화 배경색 disabled background color
        
        let drawing = false;
        let prevX = 0, prevY = 0;

        // 선 스타일 설정 (색상, 두께 등) Set line style (color, width, etc.)
        ctx.strokeStyle = '#000'; // 검정색 black
        ctx.lineWidth = 2;        // 두께 2
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // 선 그리기 함수 Draw line function
        function draw(x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.closePath();
        }

        // 전체 지우기 함수 Clear canvas function
        function clearCanvas() {
            // 내 화면 지우기 Clear my canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 서버에 지우기 신호 전송 Send clear signal to server
            socket.emit('clear_canvas');
        }

        // 마우스 이벤트 리스너 Mouse event listeners
        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            [prevX, prevY] = [e.offsetX, e.offsetY];
        });

        canvas.addEventListener('mousemove', (e) => {
            // 게임이 시작되어야 활성화 Activate only when game is started
            if (!drawing || !isGameStarted) return;

            const currX = e.offsetX;
            const currY = e.offsetY;

            // 1. 내 화면에 선 그리기 Draw on my canvas
            draw(prevX, prevY, currX, currY);

            // 2. 서버로 좌표 전송 (상대방 공유용) Send coordinates to server (for sharing with others)
            socket.emit('draw_data', { 
                prevX: Math.round(prevX), 
                prevY: Math.round(prevY), 
                currX: Math.round(currX), 
                currY: Math.round(currY) 
            });

            [prevX, prevY] = [currX, currY];
        });

        window.addEventListener('mouseup', () => drawing = false);

        // 캔버스 소켓 수신 이벤트 Canvas socket receive event

        // 상대방이 그린 데이터 수신 Receive drawing data from others
        socket.on('receive_draw', (data) => {
            draw(data.prevX, data.prevY, data.currX, data.currY);
        });

        // 상대방이 지운 신호 수신 Receive clear signal from others
        socket.on('clear_canvas', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // 재연결 성공 시 처리 Handle successful reconnection
        socket.on('reconnect_success', (data) => {
            addLog(`Connection restored! Room ID: ${data.roomId}`);
            
            // UI 전환 (이미 전환되어 있다면 무시됨) Switch UI (will be ignored if already switched)
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            statusBox.className = "status-box connected";
            statusText.innerText = "Connected (Recovered)";
            roomIdText.innerText = data.roomId;
            userCountSpan.innerText = data.users.length;

            // 세션 정보 갱신 (새로운 socket.id로 업데이트) Update session info with new socket.id
            const sessionInfo = {
                roomId: data.roomId,
                nickname: data.nickname || document.getElementById('nicknameInput').value,
                oldSocketId: socket.id
            };
            sessionStorage.setItem("highfive_session", JSON.stringify(sessionInfo));
        });

        // 재연결 실패 시 처리 Handle reconnect failure
        socket.on('reconnect_fail', (msg) => {
            addLog(`Failed to reconnect: ${msg}`);
            sessionStorage.removeItem("highfive_session"); // 만료된 세션 삭제
            resetLoginUI();
        });

        // 인원수 업데이트 수신 Receive user count updates
        socket.on("room_update", (data) => {
            // 처음 입장 성공 시점에만 화면을 전환합니다. Only switch screen on first successful join.
            if (document.getElementById('loginArea').style.display !== 'none') {
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                statusBox.className = "status-box connected";
                statusText.innerText = "Connected (ID: " + socket.id + ")";
                
                // 입장 성공 시 세션 정보 저장 Save session info on successful join
                const sessionInfo = {
                    roomId: data.roomId,
                    nickname: document.getElementById('nicknameInput').value,
                    oldSocketId: socket.id
                };
                sessionStorage.setItem("highfive_session", JSON.stringify(sessionInfo));
            }
            const { roomId, users } = data;
            roomIdText.innerText = roomId;
            // UI 유저 수 업데이트 Update user counts
            userCountSpan.innerText = users.length;

            // 로그에 방 ID와 현재 접속자 명단 출력 Print current room ID and user list in log
            const userNames = users.map(u => u.nickname).join(', ');
            addLog(`[qkd: ${roomId}] 현재 인원: ${users.length}명 (${userNames})`);
        });

        // 서버로부터 게임 시작 신호 수신 Receive game start signal from server
        socket.on('game_start', (data) => {
            isGameStarted = true; // 게임 시작 플래그 활성화 Activate game start flag
            
            // 캔버스 UI 활성화 Activate canvas UI
            canvas.style.opacity = "1.0";
            canvas.style.pointerEvents = "auto";
            canvas.style.backgroundColor = "#fff";
            canvas.style.border = "2px solid #2e7d32"; // 시작 시 테두리 색상 변경 Change border color when game starts
            
            addLog("5명이 모두 모였습니다! 게임을 시작합니다.", false);
        });

        // 5명 초과 시 서버에서 보내는 에러 메시지 Receive error messages when trying to enter a full room
        socket.on("error_message", (msg) => {
            const lowerMsg = String(msg).toLowerCase();
            alert("⚠️ " + msg);

            // 메시지 내용에 따라 후속 조치 결정 Determine follow-up actions based on message content
            if (lowerMsg.includes("use") || lowerMsg.includes("full")) {
                
                // UI 복구 함수 실행 Run UI reset function
                resetLoginUI();
                
                addLog("Entry failed: " + msg);

                socket.disconnect(); // 연결 끊기 Force disconnect to reset state
            } else {
                // [레디스 장애 등] 치명적 에러인 경우 Hard error like Redis failure
                statusBox.className = "status-box disconnected";
                statusText.innerText = "Service maintenance";
                addLog("Critical error: " + msg);
            }
        });

        // 연결 끊김 시 If disconnected
        socket.on("disconnect", (reason) => {
            statusBox.className = "status-box disconnected";
            // 사유에 따른 메시지 세분화 (사용자 친화적 문구)
            let message = "Connection lost";
            if (reason === "ping timeout") {
                message = "Disconnected due to inactivity (Zombie)";
            } else if (reason === "io server disconnect") {
                message = "Server forced disconnection";
            } else if (reason === "transport close") {
                message = "Server connection closed";
            }

            statusText.innerText = `${message} (${reason})`;
            addLog(`Connection lost. Reason: ${reason}`);
            
            // 좀비 테스트나 서버 점검 시 도움이 되는 안내
            if (reason === "ping timeout") {
                addLog("⚠️ 장시간 응답이 없어 서버가 연결을 종료했습니다.");
            }
        });

        // 페이지 로드 시 기존 세션이 있는지 확인하여 자동 재연결 시도 Check for existing session on page load and attempt auto-reconnect
        window.addEventListener('load', () => {
            const savedSession = sessionStorage.getItem("highfive_session");
            if (savedSession) {
                const data = JSON.parse(savedSession);
                addLog(`[SYSTEM] 이전 세션 발견. 재연결 시도 중... (${data.nickname})`);
                
                // 소켓 연결 시작 Start socket connection
                socket.connect();
                
                // 연결이 되자마자 서버에 알림 Notify server immediately upon connection
                socket.once("connect", () => {
                    socket.emit('try_reconnect', data);
                });
            }
        });
    </script>
</body>
</html>
